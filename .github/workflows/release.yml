name: Release

# 触发方式：只有推送 v* 标签（例如 v0.1.0）才会执行本工作流。
# 不使用 workflow_dispatch —— 本工作流的所有步骤都依赖标签 ref，避免手动触发时误发 Release。
on:
  push:
    tags:
      - 'v*'

# 创建 GitHub Release 与上传资产需要写权限（仓库默认只读）。
permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: 测试、构建并发布 UsbBackup (win-x64)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        shell: pwsh
        run: |
          dotnet restore WinToolBox.sln
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore 失败，退出码 $LASTEXITCODE" }

      - name: 编译 Release
        shell: pwsh
        run: |
          dotnet build WinToolBox.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet build 失败，退出码 $LASTEXITCODE" }

      # CI 上没有物理 U 盘，UsbDetector / WM_DEVICECHANGE 的运行期行为不在此验证，
      # 但包含它们的项目必须编译通过（上一步已保证），且这里的单元测试失败必须让工作流失败。
      - name: 运行单元测试
        shell: pwsh
        run: |
          dotnet test WinToolBox.sln -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "dotnet test 失败，退出码 $LASTEXITCODE" }

      - name: 发布单文件 exe（win-x64、自包含）
        shell: pwsh
        run: |
          dotnet publish src/Tools/UsbBackup/UsbBackup.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish 失败，退出码 $LASTEXITCODE" }

      # 产物存在性校验：避免构建异常时静默发布一个空包。
      - name: 校验产物存在
        shell: pwsh
        run: |
          if (-not (Test-Path -Path 'publish/UsbBackup.exe' -PathType Leaf)) {
            throw "发布失败：未找到 publish/UsbBackup.exe"
          }
          Write-Host '发布目录内容：'
          Get-ChildItem -Path 'publish' | Format-Table Name, Length

      - name: 打包为 UsbBackup-win-x64.zip
        shell: pwsh
        run: |
          $zip = 'UsbBackup-win-x64.zip'
          if (Test-Path -Path $zip) { Remove-Item -Path $zip -Force }
          Compress-Archive -Path 'publish/*' -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path -Path $zip -PathType Leaf)) {
            throw "打包失败：未生成 $zip"
          }
          Write-Host ("压缩包大小：{0:N2} MB" -f ((Get-Item $zip).Length / 1MB))

      - name: 创建 GitHub Release 并上传 zip
        uses: softprops/action-gh-release@v2
        with:
          name: UsbBackup ${{ github.ref_name }}
          files: UsbBackup-win-x64.zip
          generate_release_notes: true
