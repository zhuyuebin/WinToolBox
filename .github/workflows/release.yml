name: Release

# 触发方式：只有推送 v* 标签（例如 v0.2.0）才会执行本工作流。
# 不使用 workflow_dispatch —— 本工作流的所有步骤都依赖标签 ref，避免手动触发时误发 Release。
on:
  push:
    tags:
      - 'v*'

# 创建 GitHub Release 与上传资产需要写权限（仓库默认只读）。
permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: 测试、构建并发布 UsbBackup / FileMaster (win-x64)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        shell: pwsh
        run: |
          dotnet restore WinToolBox.sln
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore 失败，退出码 $LASTEXITCODE" }

      - name: 编译 Release
        shell: pwsh
        run: |
          dotnet build WinToolBox.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet build 失败，退出码 $LASTEXITCODE" }

      # CI 上没有物理 U 盘，UsbDetector / WM_DEVICECHANGE 的运行期行为不在此验证，
      # 但包含它们的项目必须编译通过（上一步已保证），且这里的单元测试失败必须让工作流失败。
      - name: 运行单元测试
        shell: pwsh
        run: |
          dotnet test WinToolBox.sln -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "dotnet test 失败，退出码 $LASTEXITCODE" }

      - name: 发布单文件 exe（win-x64、自包含）
        shell: pwsh
        run: |
          dotnet publish src/Tools/UsbBackup/UsbBackup.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o publish/UsbBackup
          if ($LASTEXITCODE -ne 0) { throw "UsbBackup 发布失败，退出码 $LASTEXITCODE" }

          dotnet publish src/Tools/FileMaster/FileMaster.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o publish/FileMaster
          if ($LASTEXITCODE -ne 0) { throw "FileMaster 发布失败，退出码 $LASTEXITCODE" }

      # 产物存在性校验：避免构建异常时静默发布一个空包。
      - name: 校验产物存在
        shell: pwsh
        run: |
          $expected = @('publish/UsbBackup/UsbBackup.exe', 'publish/FileMaster/FileMaster.exe')
          foreach ($exe in $expected) {
            if (-not (Test-Path -Path $exe -PathType Leaf)) {
              throw "发布失败：未找到 $exe"
            }
          }
          Write-Host '发布目录内容：'
          Get-ChildItem -Path 'publish' -Recurse -File | Format-Table FullName, Length

      - name: 打包为两个 zip
        shell: pwsh
        run: |
          $targets = @(
            @{ Name = 'UsbBackup-win-x64.zip';     Source = 'publish/UsbBackup/*' },
            @{ Name = 'FileMaster-win-x64.zip'; Source = 'publish/FileMaster/*' }
          )

          foreach ($t in $targets) {
            if (Test-Path -Path $t.Name) { Remove-Item -Path $t.Name -Force }
            Compress-Archive -Path $t.Source -DestinationPath $t.Name -CompressionLevel Optimal
            if (-not (Test-Path -Path $t.Name -PathType Leaf)) {
              throw "打包失败：未生成 $($t.Name)"
            }
            Write-Host ("{0}：{1:N2} MB" -f $t.Name, ((Get-Item $t.Name).Length / 1MB))
          }

      - name: 创建 GitHub Release 并上传 zip
        uses: softprops/action-gh-release@v2
        with:
          name: WinToolBox ${{ github.ref_name }}
          files: |
            UsbBackup-win-x64.zip
            FileMaster-win-x64.zip
          generate_release_notes: true
